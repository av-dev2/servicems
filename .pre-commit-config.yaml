exclude: "node_modules|.git|servicems/public/frontend/assets"
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-ast
      - id: debug-statements
      - id: no-commit-to-branch
        args:
          - --branch
          - main
          - --branch
          - master
          - --branch
          - develop
          - --branch
          - version-15
          - --branch
          - version-15-hotfix

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff
        name: "Run ruff linter and apply fixes"
        args: ["--fix"]
        files: "^servicems/.*\\.py$"
        stages: [manual]
      - id: ruff-format
        name: "Format Python code"
        files: "^servicems/.*\\.py$"
        stages: [manual]

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, css, scss, json]
        files: "^(frontend|servicems)/.*"
        exclude: |
          (?x)^(
              frontend/dist/.*|
              servicems/public/frontend/assets/.*|
              .*node_modules.*|
              .*boilerplate.*
          )$
        stages: [manual]

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
